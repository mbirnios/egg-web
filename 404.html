<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta página no existe — El Gordo Gekko</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0d0b09">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .oops{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
    background:
      radial-gradient(700px 460px at 50% 20%, rgba(240,122,38,.14), transparent 62%),
      var(--bg);
  }
  .oops__code{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(88px,20vw,180px); line-height:.9; letter-spacing:.02em;
    color:#fff; text-shadow:0 0 50px rgba(240,122,38,.32);
  }
  .oops__crown{ color:var(--gold); font-size:28px; }
  .oops h1{
    margin:10px 0 14px;
    font-size:clamp(22px,3.4vw,32px); font-weight:700; color:#fff; letter-spacing:-.01em;
  }
  .oops p{ margin:0 0 30px; max-width:46ch; color:var(--ink-soft); font-size:17px; }
  .oops__tag{
    margin:34px 0 0;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.04em; font-weight:600;
    color:var(--gold);
  }
</style>
</head>
<body>

<main class="oops">
  <span class="oops__crown" aria-hidden="true">♛</span>
  <p class="oops__code">404</p>
  <h1>Acá no hay nada.</h1>
  <p>
    El Gordo revisó, no encontró esta página y volvió a su sillón. Puede que el link esté viejo o
    que la hayas escrito de memoria.
  </p>
  <a class="btn btn--primary" href="/">Volver al principio</a>
  <p class="oops__tag">Comprar barato. Vender caro. Reírse siempre.</p>
</main>

</body>
</html>
